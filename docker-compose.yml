services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-dev}
      APP_RELOAD: "false"
      APP_LOG_FORMAT: ${APP_LOG_FORMAT:-json}
      # Hostnames differ here: DB_HOST in .env is localhost, which inside a
      # container means the container itself.
      DB_ENABLED: "true"
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      DB_NAME: ${POSTGRES_DB:-app}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # For MySQL instead of Postgres: replace the `postgres` service above with
  # this one, point the api's DB_HOST at it, and build with
  # `--build-arg EXTRAS="mysql redis"` so aiomysql is installed.
  #
  # mysql:
  #   image: mysql:8.4
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  #     MYSQL_USER: ${MYSQL_USER:-app}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
  #   ports:
  #     - "${MYSQL_PORT:-3306}:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 15
  #
  # Then on the api service:
  #   DB_DRIVER: mysql+aiomysql
  #   DB_HOST: mysql
  #   DB_PORT: 3306
  #   depends_on: { mysql: { condition: service_healthy } }

volumes:
  postgres_data:
  redis_data:
  # mysql_data:
