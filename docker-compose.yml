# worker and beat join in step 2.5 (Celery app), frontend in step 6.8.

# Shared by every container that runs the app's code. Hostnames differ from
# .env: localhost inside a container means the container itself.
x-app-env: &app-env
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-dev}
  APP_LOG_FORMAT: ${APP_LOG_FORMAT:-json}
  DB_ENABLED: "true"
  DB_HOST: postgres
  DB_USER: ${POSTGRES_USER:-app}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
  DB_NAME: ${POSTGRES_DB:-app}
  REDIS_ENABLED: "true"
  REDIS_HOST: redis
  QDRANT_ENABLED: "true"
  QDRANT_HOST: qdrant
  MONGO_ENABLED: "true"
  MONGO_HOST: mongo
  MONGO_USER: ${MONGO_USER:-app}
  MONGO_PASSWORD: ${MONGO_PASSWORD:-app}
  S3_ENABLED: "true"
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-docsearch}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-docsearch-secret}
  # Signing keys are fetched over the Docker network; tokens name the
  # browser-facing address as their issuer.
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8080}
  LLM_OLLAMA_BASE_URL: http://ollama:11434/v1
  LLM_ANTHROPIC_API_KEY: ${LLM_ANTHROPIC_API_KEY:-}
  LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}

x-app-build: &app-build
  context: .
  target: runtime

services:
  api:
    build: *app-build
    image: docsearch-app:local
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      <<: *app-env
      APP_RELOAD: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mongo:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: applies migrations, then exits. The api starts only after it
  # succeeds, so it never runs against an outdated schema.
  migrate:
    build: *app-build
    image: docsearch-app:local
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the volume is first created.
      - ./docker/postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/init-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl; bash's /dev/tcp sends the request instead.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    # 8.0 refuses to start on Linux kernel 6.19+ (SERVER-121912).
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-app}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-app}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    # -ip.bind: by default it listens only on the container's own address,
    # which the localhost health check below cannot reach.
    command:
      ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0", "-master.telemetry=false"]
    environment:
      # The S3 gateway accepts exactly these credentials.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-docsearch}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-docsearch-secret}
    ports:
      - "${SEAWEEDFS_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8333"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-app}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Fixed issuer for tokens, while the api can still reach Keycloak at
      # http://keycloak:8080 over the Docker network.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Health lives on the management port, 9000. No curl in the image.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ollama:
    image: ollama/ollama:0.40.11
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      # Healthy only once the model is downloaded (about 5 GB the first time).
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30m
      start_interval: 10s

  # For MySQL instead of Postgres: replace the `postgres` service above with
  # this one, point the api's DB_HOST at it, and build with
  # `--build-arg EXTRAS="mysql redis"` so aiomysql is installed.
  #
  # mysql:
  #   image: mysql:8.4
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  #     MYSQL_USER: ${MYSQL_USER:-app}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
  #   ports:
  #     - "${MYSQL_PORT:-3306}:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 15
  #
  # Then on the api service:
  #   DB_DRIVER: mysql+aiomysql
  #   DB_HOST: mysql
  #   DB_PORT: 3306
  #   depends_on: { mysql: { condition: service_healthy } }

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  mongo_data:
  seaweedfs_data:
  ollama_data:
  # mysql_data:
