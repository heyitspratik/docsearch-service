default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^app/
        # mypy runs in its own isolated venv, so every typed dependency the
        # source imports must be declared here or it reports phantom errors.
        additional_dependencies:
          - pydantic>=2.11.7
          - pydantic-settings>=2.7.0
          - fastapi>=0.116.1
          - sqlalchemy[asyncio]>=2.0.36
          - redis>=5.2.1
          - qdrant-client>=1.20.0
          - pymongo>=4.19.0
          - aioboto3>=15.5.0
          - celery[redis]>=5.6.3
          - anthropic>=2.3.0
          - openai>=3.37.0
          - pyjwt[crypto]>=2.15.1
          - opentelemetry-api>=1.45.1
          - opentelemetry-sdk>=1.45.1
          # fastembed and docling pull in torch; the CPU index keeps the hook
          # venv from downloading the CUDA build.
          - --extra-index-url=https://download.pytorch.org/whl/cpu
          - fastembed>=0.9.1
          - docling>=2.142.1
        args: [--config-file=pyproject.toml]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      # Runs hadolint from its Docker image, so no local install is needed.
      - id: hadolint-docker
